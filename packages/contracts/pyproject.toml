[project]
name = "listening-contracts"
version = "1.0.0"
description = "The listening platform's message contracts for Python: generated Pydantic models, key helpers and registries (F2)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.5",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# uv reads only the nearest [tool.uv] table, so this repeats the root uv.toml pin.
required-version = ">=0.12.23,<0.13"

[tool.uv.build-backend]
module-name = "listening_contracts"
module-root = "python"

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
"python/tests/**" = ["ANN401"]
# The fixture generator is data: messages written as dict literals, long Arabic strings included.
"scripts/fixtures/**" = ["ANN401", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["listening_contracts"]
known-local-folder = ["conftest"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["python", "scripts"]
extraPaths = ["python/tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
testpaths = ["python/tests"]
