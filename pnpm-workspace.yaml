# Workspaces: one package per service, shared package, tool, probe and end-to-end suite.
# Package names are unscoped and equal to the directory name, so `pnpm --filter <service>` works.
packages:
  - services/*
  - packages/*
  - tools/*
  - tools/probes/*
  - tests/e2e/*

# pnpm switches itself to the version in package.json "packageManager".
managePackageManagerVersions: true

# Install scripts run only for these packages (pnpm 10 blocks the rest).
onlyBuiltDependencies:
  - "@confluentinc/kafka-javascript"

# One version of each shared development tool for every workspace ("catalog:" in package.json).
catalog:
  "@aws-sdk/client-s3": 3.1155.0
  "@confluentinc/kafka-javascript": 1.11.0
  "@eslint-community/eslint-plugin-eslint-comments": 4.8.1
  "@eslint/js": 9.39.5
  "@types/node": 24.19.2
  "@types/pg": 8.23.1
  eslint: 9.39.5
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  pg: 8.23.1
  prettier: 3.9.10
  supabase: 2.121.0
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vitest: 4.1.12
  yaml: 2.9.1
