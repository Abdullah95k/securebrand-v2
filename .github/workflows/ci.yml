# CI for every pull request and every push to main. Required checks on main (set by the user in
# branch protection): check, policy (policy.yml) and template-smoke. Every action is pinned to a
# commit; the toolchain comes from the same pins a session uses (.node-version, packageManager,
# uv.toml, .python-version, the pnpm catalog).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Python from .python-version
        run: uv python install
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Log in to GHCR (the stack's image mirror)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: make doctor
        run: make doctor
      - name: make up
        env:
          IMAGE_PULL_WAIT_SECONDS: "600"
        run: make up
      - name: make check, with the acceptance suites of the changed packages
        run: |
          mkdir -p .build-state
          make check ACCEPTANCE=1 2>&1 | tee .build-state/ci-check.log
      - name: make smoke
        run: make smoke
      - name: Stack logs
        if: failure()
        run: |
          mkdir -p .build-state
          scripts/compose.sh logs --no-color > .build-state/stack.log 2>&1 || true
          docker ps -a > .build-state/containers.txt 2>&1 || true
      - name: make down
        if: always()
        run: make down || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: check-logs
          path: .build-state/
          include-hidden-files: true
          if-no-files-found: ignore

  template-smoke:
    name: template-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Python from .python-version
        run: uv python install
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: G0 check 1 (TypeScript)
        run: pnpm new:service demo && make check
      - name: G0 check 1, the Python twin
        run: pnpm new:service demo-py --lang python && make check
