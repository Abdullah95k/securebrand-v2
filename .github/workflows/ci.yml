# CI for every pull request and every push to main. Required checks on main (set by the user in
# branch protection): check, policy (policy.yml) and template-smoke. Every action is pinned to a
# commit; the toolchain comes from the same pins a session uses (.node-version, packageManager,
# uv.toml, .python-version, the pnpm catalog).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Keep the Supabase ports out of the ephemeral range
        # supabase/config.toml publishes 54320-54329 (API 54321, database 54322), inside Linux's
        # ephemeral range (32768-60999): an outbound connection (an image pull, pnpm install) can
        # hold one when make up binds it ("address already in use"). First, so no step's sockets do.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Python from .python-version
        run: uv python install
      - name: Install
        # The locked packages of every workspace into pnpm's store, and the Python template's into
        # uv's cache: the tests and pnpm new:service install from them and need no network.
        run: |
          pnpm install --frozen-lockfile
          (cd services/_template-py && uv sync --locked)
      - name: Prettier (pnpm fmt:check)
        run: pnpm fmt:check
      - name: Log in to GHCR (the stack's image mirror)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: make doctor
        run: make doctor
      - name: make up
        env:
          IMAGE_PULL_WAIT_SECONDS: "600"
        run: make up
      - name: make check, with the acceptance suites of the changed packages
        env:
          # On a push to main, compare with the commit before the push: the merge base of main
          # with itself is HEAD, which would check nothing. An unknown commit checks everything.
          CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          # The acceptance test of make down may wipe this runner's stack (nobody else uses it).
          TEST_STACK_RESET: "1"
        run: |
          mkdir -p .build-state
          make check ACCEPTANCE=1 2>&1 | tee .build-state/ci-check.log
      - name: make smoke
        run: make smoke
      - name: Stack logs
        if: failure()
        run: |
          mkdir -p .build-state
          scripts/compose.sh logs --no-color > .build-state/stack.log 2>&1 || true
          docker ps -a > .build-state/containers.txt 2>&1 || true
          sudo ss -tanp > .build-state/sockets.txt 2>&1 || true
      - name: make down
        if: always()
        run: make down || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: check-logs
          path: .build-state/
          include-hidden-files: true
          if-no-files-found: ignore

  template-smoke:
    name: template-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Python from .python-version
        run: uv python install
      - name: Install
        # The locked packages of every workspace into pnpm's store, and the Python template's into
        # uv's cache: the tests and pnpm new:service install from them and need no network.
        run: |
          pnpm install --frozen-lockfile
          (cd services/_template-py && uv sync --locked)
      - name: G0 check 1 (TypeScript)
        run: pnpm new:service demo && make check
      - name: G0 check 1, the Python twin
        run: pnpm new:service demo-py --lang python && make check
