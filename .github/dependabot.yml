# Weekly, grouped, few open pull requests at a time. Major versions are planned upgrades (Node 26,
# pnpm 11, TypeScript 7, Python 3.14 and the rest are follow-ups in docs/handoffs/F1.md), and so is
# a minor bump of a 0.x tool or of Python, which can break like a major one: Dependabot proposes
# minor and patch updates, and ignores uv-build's minors, which follow uv.toml's required-version.
# The stack's image tags in stack/versions.env and the service templates' base images (which follow
# .node-version, .python-version and uv.toml) are bumped by hand. Renovate is not used: Mend.io
# fails the vendor screen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories:
      - /services/*
      - /packages/*
      - /py/*
      - /tools/probes/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      uv:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uv-build"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
