# Weekly, grouped, few open pull requests at a time. Dependabot proposes minor and patch updates and
# ignores majors, which are planned upgrades (Node 26, pnpm 11, TypeScript 7, Python 3.14 and the
# rest are follow-ups in docs/handoffs/F1.md). A minor update of a 0.x tool (ruff 0.16 to 0.17) can
# break like a major one: review such a pull request as a planned upgrade. uv-build's minors are
# ignored, since they must follow uv.toml's required-version. The stack's image tags in
# stack/versions.env and the service templates' base images (which follow .node-version,
# .python-version and uv.toml) are bumped by hand. Renovate is not used: Mend.io fails the vendor
# screen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories:
      - /services/*
      - /packages/*
      - /py/*
      - /tools/probes/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      uv:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uv-build"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
